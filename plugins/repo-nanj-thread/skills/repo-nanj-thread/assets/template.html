<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{
  --bg:#efefef; --paper:#f6f6f2; --line:#d8d8d0; --num:#a00000;
  --name:#008800; --id:#888; --link:#0000ee; --accent:#5a8f5a;
  --card:#ffffff; --callout:#fff6d8; --mono:ui-monospace,"Cascadia Mono","BIZ UDGothic",Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#222;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  font-size:15px;line-height:1.7}
.wrap{max-width:920px;margin:0 auto;padding:0 10px 60px}
.thread-head{background:#800000;color:#fff;padding:10px 14px;margin:0 -10px}
.thread-head h1{margin:0;font-size:1.15em;line-height:1.4}
.thread-head .meta{font-size:.8em;color:#f2d8d8;margin-top:4px}
nav.toc{background:var(--card);border:1px solid var(--line);border-radius:6px;
  margin:12px 0;padding:8px 12px;font-size:.92em}
nav.toc summary{cursor:pointer;font-weight:700;color:#800000}
nav.toc ol{margin:.5em 0 .3em;padding-left:1.6em}
nav.toc li{margin:.15em 0}
nav.toc .range{color:#999;margin-left:.6em;font-size:.85em}
main{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:2px 0}
.res{padding:.6em .9em;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.res:last-child{border-bottom:none}
.res:target{background:#fdf3d8}
.res::before{content:attr(data-n) "：";color:var(--num);font-weight:700;margin-right:.35em}
.res header{display:inline;color:var(--name);font-weight:700}
.res .id{color:var(--id);font-weight:400;margin-left:.55em;font-size:.9em}
.res .body{margin:.35em 0 0 1.1em}
a{color:var(--link)}
a.anc{text-decoration:underline}
/* ---- インフォグラフィック部品 ---- */
.ig{background:var(--card);border:1px solid #ccc;border-radius:8px;
  padding:.7em .95em;margin:.6em 0;max-width:680px;font-size:.93em}
.ig .ig-title{font-weight:700;color:#444;margin:0 0 .4em;border-left:4px solid var(--accent);padding-left:.5em}
pre.ig{font-family:var(--mono);white-space:pre;overflow-x:auto;line-height:1.5}
.ig-tree{background:#f7fbf7}
.ig-code{background:#f4f4f8}
.ig-code .fn{display:block;font-weight:700;color:#666;border-bottom:1px dashed #ccc;
  margin-bottom:.4em;padding-bottom:.2em;font-family:var(--mono)}
.ig-flow{display:flex;flex-wrap:wrap;gap:.35em;align-items:center}
.ig-flow .step{background:#eef6ee;border:1px solid #9fc79f;border-radius:5px;padding:.15em .6em}
.ig-flow .arrow{color:#888;font-weight:700}
.ig-stat .row{display:flex;align-items:center;gap:.6em;margin:.25em 0}
.ig-stat .label{min-width:8em;text-align:right;color:#555}
.ig-stat .bar{flex:1;height:.95em;background:#e8e8e8;border-radius:4px;position:relative;overflow:hidden}
.ig-stat .bar::before{content:"";position:absolute;inset:0;width:var(--w,0%);background:var(--accent)}
.ig-stat .val{min-width:4.5em;color:#555;font-family:var(--mono);font-size:.9em}
.ig-table table{border-collapse:collapse;width:100%}
.ig-table th,.ig-table td{border:1px solid #ccc;padding:.3em .55em;text-align:left;vertical-align:top}
.ig-table th{background:#eef2ee}
.ig-callout{background:var(--callout);border-color:#e0c060}
.ig-callout .ig-title{border-left-color:#d8a020}
footer{margin:14px 0 0;color:#777;font-size:.8em;text-align:center;line-height:1.9}
.totop{position:fixed;right:14px;bottom:14px;background:#800000;color:#fff;
  text-decoration:none;padding:.45em .7em;border-radius:6px;font-size:.85em;opacity:.85}
@media (max-width:600px){
  body{font-size:14px}
  .ig-stat .label{min-width:5.5em}
}
</style>
</head>
<body id="top">
<div class="wrap">
<div class="thread-head">
<h1>{{TITLE}}</h1>
<div class="meta">{{REPO}} ｜ 対象 {{FILES}} ファイル・{{LINES}} 行 ｜ {{RES}} レス ｜ {{DATE}}</div>
</div>
<nav class="toc"><details open><summary>このスレの目次（ブロック別）</summary><ol>
<!-- TOC -->
</ol></details></nav>

</footer>
<a class="totop" href="#top">▲上へ</a>
</div>
</body>
</html>
